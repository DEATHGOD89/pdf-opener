[package]
name = "pdf-opener-pro"
version = "0.1.0"
description = "Professional PDF Opener with Advanced Features"
authors = ["Your Name <your@email.com>"]
edition = "2021"
rust-version = "1.75"
license = "MIT"

[lib]
name = "pdf_opener_pro"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pdf-opener-pro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "process-all", "fs-read-file", "fs-write-file", "window-all", "dialog-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
log = "0.4"
env_logger = "0.10"
uuid = { version = "1.6", features = ["v4"] }
mimalloc = { version = "0.1", features = ["secure"] }
lopdf = "0.32"

[profile.dev]
opt-level = 0
lto = false
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
